<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthDesk - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=MonteCarlo&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B4F72 0%, #2E86C1 50%, #1a6fa0 100%);
            font-family: 'Poppins', sans-serif;
            padding: 16px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }
        .login-card {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
            padding: 40px 36px 36px;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-brand .brand-health {
            font-family: 'Satisfy', cursive;
            font-size: 30px;
            color: #2E86C1;
        }
        .login-brand .brand-desk {
            font-family: 'MonteCarlo', cursive;
            font-size: 34px;
            background: linear-gradient(45deg, #2E86C1, #1B4F72);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-left: 3px;
        }
        .login-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }
        .login-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2E86C1, #1B4F72);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 11px 16px;
            border-color: #e2e8f0;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #2E86C1;
            box-shadow: 0 0 0 3px rgba(46,134,193,0.12);
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6c757d;
        }
        .btn-login {
            background: linear-gradient(135deg, #2E86C1, #1B4F72);
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            width: 100%;
            transition: all 0.25s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(27,79,114,0.3);
            color: white;
        }
        .alert {
            border-radius: 10px;
            font-size: 0.85rem;
        }
        @media (max-width: 480px) {
            .login-card { padding: 28px 24px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon">
                <i class="bi bi-hospital"></i>
            </div>
            <div class="login-brand">
                <span class="brand-health">Health</span><span class="brand-desk">Desk</span>
            </div>
            <p class="login-subtitle">Clinical Staff Login</p>

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button class="btn btn-login mt-1">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>

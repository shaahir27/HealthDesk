{% extends "index.html" %}

{% block content %}

<div class="container mt-5" style="max-width: 700px;">

<!-- Title -->
<h4 class="mb-3" style="color:#2E86C1;">
    Patient Registration Complete
</h4>

<!-- Subtle Status -->
<p class="text-muted mb-4">
    The patient has been successfully added to the system.
</p>

<!-- Info Section -->
<div class="border rounded p-3 mb-4 bg-light">

    <div class="row py-2 border-bottom">
        <div class="col-5 text-muted">Patient ID</div>
        <div class="col-7 fw-semibold text-primary">{{ patient_id }}</div>
    </div>

    <div class="row py-2 border-bottom">
        <div class="col-5 text-muted">Department</div>
        <div class="col-7">{{ department }}</div>
    </div>

    <div class="row py-2 border-bottom">
        <div class="col-5 text-muted">Visit Type</div>
        <div class="col-7">{{ visit_type }}</div>
    </div>

    <div class="row py-2">
        <div class="col-5 text-muted">Priority</div>
        <div class="col-7">
            <span class="fw-semibold {% if priority == 'Urgent' %}text-danger{% else %}text-success{% endif %}">
                {{ priority }}
            </span>
        </div>
    </div>

</div>

<!-- Action Bar -->
<div class="d-flex justify-content-between align-items-center">

    <div>
        <a href="/patient" class="btn btn-outline-primary">
            Add Another
        </a>
    </div>

    <div class="d-flex gap-2">
        <a href="/queue" class="btn btn-primary">
            Go to Queue
        </a>

        <a href="/" class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

</div>

</div>

{% endblock %}

{% extends "index.html" %}

{% block content %}

<style>
.success-card {
    border-radius: 16px;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    transition: 0.3s;
}

.success-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.08);
}

.success-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #2ecc71;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 26px;
    margin: 0 auto 10px;
}

.detail-box {
    background: #f8fafc;
    border-radius: 12px;
}

.btn-smooth {
    transition: 0.25s ease;
}

.btn-smooth:hover {
    transform: translateY(-1px);
}
</style>

<div class="container mt-5" style="max-width: 650px;">

<div class="success-card border-0">

    <div class="card-body p-4 text-center">

        <!-- ✅ ICON -->
        <div class="success-icon">✓</div>

        <!-- HEADER -->
        <h5 class="fw-bold mb-1" style="color:#2E86C1;">
            Registration Complete
        </h5>

        <small class="text-muted d-block mb-4">
            Patient has been successfully added
        </small>

        <!-- DETAILS -->
        <div class="detail-box p-3 mb-4 text-start">

            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Patient ID</span>
                <span class="fw-bold text-primary fs-5">{{ patient_id }}</span>
            </div>

            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Department</span>
                <span>{{ department }}</span>
            </div>

            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Visit Type</span>
                <span>{{ visit_type }}</span>
            </div>

            <div class="d-flex justify-content-between">
                <span class="text-muted">Priority</span>
                <span class="fw-semibold 
                    {% if priority == 'Urgent' %}text-danger{% else %}text-success{% endif %}">
                    {{ priority }}
                </span>
            </div>

        </div>

        <!-- NOTE -->
        <p class="text-muted mb-4" style="font-size: 0.9rem;">
            Ready for queue assignment
        </p>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-between flex-wrap gap-2">

            <a href="/patient" class="btn btn-outline-secondary btn-smooth">
                + Add Another
            </a>

            <div class="d-flex gap-2">

                <a href="/" class="btn btn-light border btn-smooth">
                    Dashboard
                </a>

                <a href="/queue" class="btn btn-primary btn-smooth">
                    Go to Queue →
                </a>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthDesk</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Satisfy&family=MonteCarlo&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body {
        background-color: #f4f6f8;
        font-family: 'Poppins', sans-serif;
        color: #2C3E50;
    }

    /* NAVBAR */
    .navbar {
        background: linear-gradient(90deg, #2E86C1, #1B4F72) !important;
    }

    /* BRAND LOGO */
    .brand-logo {
        display: flex;
        align-items: center;
        text-decoration: none;
    }

    .brand-health {
        font-family: 'Satisfy', cursive;
        font-size: 26px;
        color: white;
        letter-spacing: 1px;
    }

    .brand-desk {
        font-family: 'MonteCarlo', cursive;
        font-size: 30px;
        margin-left: 4px;

        background: linear-gradient(45deg, #ffffff, #D6EAF8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;

        text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    /* NAV LINKS */
    .nav-link {
        color: rgba(255,255,255,0.9) !important;
        margin-right: 10px;
        font-weight: 500;
    }

    .nav-link:hover {
        color: white !important;
        text-decoration: underline;
    }

    /* CONTAINER */
    .container-card {
        margin-top: 40px;
        max-width: 1150px;
    }

    /* CARDS */
    .card {
        border-radius: 14px;
        border: none;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    /* BUTTONS */
    .btn-primary {
        background-color: #2E86C1;
        border: none;
    }

    .btn-primary:hover {
        background-color: #1f618d;
    }

    /* STATUS COLORS */
    .text-success {
        color: #28B463 !important;
    }

    .text-danger {
        color: #E74C3C !important;
    }

    .text-warning {
        color: #F4D03F !important;
    }

        /* HERO SECTION */
    .hero-section {
        background: linear-gradient(135deg, #2E86C1, #1B4F72);
        border-radius: 14px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    /* HERO BUTTON (PRIMARY) */
    .btn-hero {
        background: #ffffff;
        color: #2E86C1;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: 500;

        transition: all 0.25s ease;
    }

    .btn-hero:hover {
        background: #f1f1f1;
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    /* HERO BUTTON (OUTLINE) */
    .btn-hero-outline {
        background: transparent;
        color: white;
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 8px;
        padding: 8px 16px;

        transition: all 0.25s ease;
    }

    .btn-hero-outline:hover {
        background: rgba(255,255,255,0.15);
        transform: translateY(-2px);
        border-color: white;
    }

</style>


</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow">
    <div class="container">

        <!-- UPDATED BRAND -->
        <a class="navbar-brand brand-logo" href="/">
            <span class="brand-health">Health</span>
            <span class="brand-desk">Desk</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/patient">Patients</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/doctors">Doctors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/queue">Queue</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/diagnosis">Diagnosis</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/billing">Billing</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container container-card">
    {% block content %}
    
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
